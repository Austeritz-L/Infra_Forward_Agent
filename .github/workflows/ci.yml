name: CPU baseline
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: python -m build
      - run: ifa demo --output runs/ci-demo
      - run: ifa architectures
      - run: ifa plan configs/campaigns/multi-architecture.json --output runs/ci-plan
      - run: ifa performance-demo --output runs/ci-performance
      - run: ifa deployment-demo --output runs/ci-deployment
      - run: ifa plan configs/campaigns/long-context-capacity.json --output runs/ci-long-context
      - run: ifa kernel-demo --architecture moore-s5000 --output runs/ci-kernel-s5000
      - run: ifa kernel-demo --architecture nvidia-sm90 --output runs/ci-kernel-sm90
      - run: ifa kernel-demo --architecture nvidia-sm103 --output runs/ci-kernel-sm103
      - run: ifa trace-demo --architecture moore-s5000 --output runs/ci-traces-s5000
      - run: ifa trace-demo --architecture nvidia-sm90 --output runs/ci-traces-sm90
      - run: ifa trace-demo --architecture nvidia-sm103 --output runs/ci-traces-sm103
