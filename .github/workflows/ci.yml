name: CPU baseline
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: python -m build
      - run: ifa demo --output runs/ci-demo
      - run: ifa architectures
      - run: ifa plan configs/campaigns/multi-architecture.json --output runs/ci-plan
