[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-forward-agent"
version = "0.4.0"
description = "Evidence-driven forward optimization workflow for heterogeneous accelerators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
ifa = "infra_forward_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"infra_forward_agent.architectures" = ["profiles/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
